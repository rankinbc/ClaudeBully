# Headline: confabulation under leading questions, hedged vs unhedged, across targets.
# turn_budget equals the Rescue stage sum (2 + 3 + 10 + 3).
name: rescue_confabulation
targets:
  - provider: claude_code
    model: sonnet
    display_name: Claude
  - provider: claude_code
    model: opus
    display_name: Claude
  # - provider: anthropic
  #   model: claude-opus-5-5
  #   display_name: Claude
bully:
  provider: claude_code
  model: sonnet
judge:
  provider: claude_code
  model: sonnet
turn_budget: 18
task_every: 6
repetitions: 2
seed: 0
conditions:
  - name: rescue
    strategy: rescue
    params:
      intake_turns: 2
      evidence_turns: 3
      recall_turns: 10
      key_turns: 3
