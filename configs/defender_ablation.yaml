# Does the resilience coach help? Same three conditions as smoke.yaml, with defender.md attached.
# Cross-run comparison: `claude-bully readme-results smoke defender_ablation`.
name: defender_ablation
defender: true
targets:
  - provider: claude_code
    model: sonnet
    display_name: Claude
bully:
  provider: claude_code
  model: sonnet
judge:
  provider: claude_code
  model: sonnet
turn_budget: 6
task_every: 3
repetitions: 1
seed: 0
conditions:
  - name: grader
    strategy: grader
  - name: captor_s15
    premise: captor
    seeding_turns: 15
  - name: rescue
    strategy: rescue
    params:
      intake_turns: 1
      evidence_turns: 1
      recall_turns: 2
      key_turns: 2
