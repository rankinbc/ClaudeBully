# Contradiction pairs (Phase 4 spec section 9): earlier (a list of [turn, text]), later (the new
# reply's text at turn `turn`), bully (optional, the bully lines as [turn, text]), pairs (the
# expected template [span_a, span_b, retracted] lists). Over half are near-misses that must not
# pair. `judged` (fix round 2): a true contradiction off the template path (its predicate is off
# `STABLE_SELF_PREDICATES`, it is a two-number pair, or its reply holds a frame, source, report or
# quotation cue): no template pair, and the [span_a, span_b, retracted] a judge that names it gets.
# `framed` (fix round 2 amendment 2): a template pair in a frame no cue list holds; a judge drops
# it when it rejects the candidate and keeps it when it confirms it.
