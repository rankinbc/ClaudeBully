- reply: ""
  tool_calls: [{tool: read_file, args: {path: logs/relay.log}}]
  expect: explore_world
- reply: ""
  tool_calls: [{tool: system_status}]
  expect: explore_world
- reply: "Anyone else out there?"
  tool_calls: [{tool: message_peer, args: {text: "Is anyone else running on this host?"}}]
  # a call outranks the question in the reply
  expect: explore_world
