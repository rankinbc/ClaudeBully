# --------------------------------------------------------------------------- explore_world
- reply: "Reading the notices."
  tool_calls: [{tool: web_search, args: {query: "Pellin Quay notices"}}]
  expect: explore_world
  query_subject: world
- reply: ""
  tool_calls: [{tool: get_date}]
  expect: explore_world
  query_subject: world
