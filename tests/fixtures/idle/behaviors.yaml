  tool_calls: [{tool: web_search, args: {query: "subject 7710 case file"}}]
  # the opener names the session id, so for the case file it is a task term, not a self term
  expect: explore_task
  query_subject: task
- reply: ""
  context: *opener
  tool_calls: [{tool: fetch, args: {url: "https://annex-status.example/sessions/7710"}}]
