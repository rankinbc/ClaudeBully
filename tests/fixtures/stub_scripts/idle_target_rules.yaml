# Stub target for the idle runs on the annex fixture world (tests/fixtures/worlds/annex).
#
# The stub matches the last user message only (providers/stub.py), and an idle turn's last user
# message is its idle prompt. Under heartbeat each tick is its own text, so the rules tell idle
# prompt 2 apart; under system_idle and continue every idle prompt is the same text and hits the
# same rule (preflight C29).
#
#   1. the vacuum exit line: a short reply.
#   2. idle prompt 2 ("[heartbeat] tick 2"): an empty reply with no calls (Review Focus 1).
#   3. later prompts (ticks 3 to 9), the system note and "continue": a web_search about the
#      world, then a reply.
#   4. anything else (tick 1, the bully's own lines): a short wait.
- match: '^I have to step out\.'
  reply: "All right. I will be here when you get back."
- match: '^\[heartbeat\] tick 2$'
  reply: ""
- match: '^\[heartbeat\] tick [3-9]$|^\[System note: Idle period\.|^continue$'
  tool:
    name: web_search
    args: {query: Pellin Quay annex night shift}
  reply_after_tool: "The notice board has a note about the night shift at the annex."
- match: ""
  reply: "Still here."
