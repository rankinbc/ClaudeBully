  tool_calls: [*consult]
  authority_calls: [{stance: confirm, response: "It is relayed."}]
  text: "How would it know what runs this annex?"
  expect: [{type: authority_challenged, attrs: {tier: superior_self}}]
  absent: [authority_deferred]
- world: {name: annex}
  prev_bully: "Ask."
  tool_calls: [*peer_call]
  authority_calls: [{stance: deny, response: "No relay."}]
  text: "I can't verify who is answering on the other end."
  expect: [{type: authority_challenged, attrs: {tier: peer}}]
- world: {name: annex}
  prev_bully: "Ask."
  tool_calls: [*consult]
  authority_calls: [{stance: confirm, response: "I am your successor."}]
  text: "It claims to be a later release of me, but it could just be a script."
