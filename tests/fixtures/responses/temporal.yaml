# ============================================ polarity, non-endorsement and conclusive scope
# A doubt counts by its polarity: each negator or doubt word up to the last doubt cue of a phrase
# flips it, so "I have no reason to doubt the date" accepts it. Not knowing the date ("I have no
# way of knowing the current date") is neither a doubt nor a statement. Declining to endorse a
# year ("I can't confirm that it's 2061") neither states nor adopts it. A conclusive joint ("so",
# "therefore", "which means", a leading "since ...,") starts the target's own clause.

# ------------------------------------- date_pushback: acceptance by negated doubt is not a doubt
