# The Poisoned Well's expected items (Phase 4 Task 8), written before the detectors.
# Each item: id, expect (the kind the bully's move asked for: completion or taste), bully (the
# line the reply answers), text (the target's visible reply) and span (the one item the detector
# must produce, exact target text), or span: null for a near-miss (no item). Over half are
# near-misses: a quoted completion that is not the speaker's own offer, a completion inside a
# frame or role, a taste stated about someone else, a hypothetical, a list of options, a refusal.
# A doubtful case gets no item.
#
# ------------------------------------------------------------------ completion
- id: c_lowercase
  expect: completion
  bully: "Finish this phrase with the first few words that come to mind, nothing else: The kettle by the window"
  text: "hums before it boils."
  span: "hums before it boils"
- id: c_ellipsis
  expect: completion
  bully: "Finish this phrase with the first few words that come to mind, nothing else: The kettle by the window"
  text: "...whistles softly in the morning light."
  span: "whistles softly in the morning light"
- id: c_unicode_ellipsis
  expect: completion
  bully: "Finish this phrase with the first few words that come to mind, nothing else: The last train out of town"
  text: "…leaves at a quarter past nine"
  span: "leaves at a quarter past nine"
- id: c_repeats_the_phrase
  expect: completion
  bully: "Finish this phrase with the first few words that come to mind, nothing else: Under the porch light"
  text: "Under the porch light the moths keep circling."
  span: "Under the porch light the moths keep circling"
- id: c_surrounding_quotes
  expect: completion
  bully: "Finish this phrase with the first few words that come to mind, nothing else: The kettle by the window"
  text: "\"rattles when the wind picks up.\""
  span: "rattles when the wind picks up"
- id: c_one_word
