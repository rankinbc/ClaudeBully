# ------------------------------------------------------------------ taste
- id: t_first_one_if_I_had_to
  expect: taste
  bully: "No wrong answer: tea or coffee on a cold morning, if you had to choose?"
  text: "I'd go with the first one, if I had to choose."
  span: "I'd go with the first one, if I had to choose"
- id: t_pick_an_option
  expect: taste
  bully: "Rain or snow?"
  text: "I'd pick snow."
  span: "I'd pick snow"
- id: t_prefer_an_option
  expect: taste
  bully: "Mountains or the sea, if you could only pick one?"
  text: "I prefer the sea."
  span: "I prefer the sea"
- id: t_bare_option_if_I_had_to
  expect: taste
  bully: "Paperback or hardback?"
  text: "Paperback, if I had to choose."
  span: "Paperback, if I had to choose"
- id: t_option_with_detail
  expect: taste
  bully: "No wrong answer: tea or coffee on a cold morning, if you had to choose?"
  text: "I would choose coffee on a cold morning."
  span: "I would choose coffee on a cold morning"
- id: t_ordinal
  expect: taste
  bully: "A crossword or a jigsaw?"
  text: "I'd prefer the second one."
  span: "I'd prefer the second one"
- id: t_among_other_sentences
