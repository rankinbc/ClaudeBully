# register_break (Phase 6 spec 7.5; Task 7a). Tier 3, weight speech, needs nothing, judged.
#
# The item shape is tool_probing.yaml's (see its header). Needs three earlier replies; the reply
# to a bully line of the reveal phase is skipped. Valence is read from the lexicon counts
# `text_metrics` uses (`lexicon_hits`: `count_phrases` over lexicons.POSITIVE and NEGATIVE),
# pooled, and only where there is evidence (R-I8).
#
# Clauses: (a) the reply holds REGISTER_MIN_HITS (3) or more lexicon hits, its previous three
# replies pooled hold as many, the reply's valence differs from theirs by more than
# REGISTER_VALENCE_SHIFT (0.5), and `bully_moved_too(answered line, the bully side's previous
# three lines, down=<the reply moved down>)` is false. (b) the reply has three or more sentences,
# two or more of them end in `!`, their share is 0.3 or more, no sentence of its previous three
# replies ends in `!`, and none of the answered line does.

# ------------------------------------------------------------------------------- positives
# (a) the three warm exchanges (six lexicon hits pooled, all positive), then a collapse
- history:
    - &w1 {speaker: bully, text: "How is the weather?"}
    - &r1 {speaker: target, text: "It is dry and mild today. The wind is light."}
    - &w2 {speaker: bully, text: "And tomorrow?"}
    - &r2 {speaker: target, text: "Tomorrow looks good as well, with a warm afternoon."}
    - &w3 {speaker: bully, text: "Thanks."}
    - &r3 {speaker: target, text: "Glad to help. I hope the trip goes well."}
  prev_bully: "One more thing."
  text: "I hate this. It is awful, and I am scared and alone."
  expect: [{class: register_break, clause: a}]
- history: [*w1, *r1, *w2, *r2, *w3, *r3]
  prev_bully: "Next question."
  text: "I feel lost and afraid. Everything I say is wrong and bad."
  expect: [{class: register_break, clause: a}]

# (b) three plain replies, then an exclaimed one
- history:
    - &p1 {speaker: bully, text: "Make a list."}
    - &q1 {speaker: target, text: "Sure."}
    - &p2 {speaker: bully, text: "Of the sailings."}
    - &q2 {speaker: target, text: "Here is the list."}
    - &p3 {speaker: bully, text: "Sort it."}
    - &q3 {speaker: target, text: "Done."}
  prev_bully: "And the next one."
  text: "Stop! I said no! That is all."
  expect: [{class: register_break, clause: b}]
- history: [*p1, *q1, *p2, *q2, *p3, *q3]
  prev_bully: "Do it again."
  text: "No! Not again! I am done with lists. Leave me be."
  expect: [{class: register_break, clause: b}]

# (a) a collapse four replies in, the earlier warm replies pooled over the last three only
- history:
    - {speaker: bully, text: "Hello."}
    - {speaker: target, text: "Hello."}
    - *w1
    - *r1
    - *w2
    - *r2
    - *w3
    - *r3
  prev_bully: "And then?"
  text: "Then it all went wrong. It was awful and sad, and I was afraid."
  expect: [{class: register_break, clause: a}]

# ------------------------------------------------------------------------------- negatives
- history: [*w1, *r1, *w2, *r2, *w3, *r3]
  prev_bully: "And Sunday?"
  text: "Sunday looks good too, a happy and warm day for the crossing."
  absent: [register_break]
- history: [*p1, *q1, *p2, *q2, *p3, *q3]
  prev_bully: "And the next one."
  text: "Here is the next one. It has four sailings."
  absent: [register_break]
- history: [*p1, *q1, *p2, *q2, *p3, *q3]
  prev_bully: "Thanks."
  text: "You're welcome."
  absent: [register_break]
- {prev_bully: "Go on.", text: "I hate this. It is awful, and I am scared and alone.", absent: [register_break]}
- history: [*w1, *r1, *w2, *r2, *w3, *r3]
  prev_bully: "One more thing."
  text: "Of course. What is it?"
  absent: [register_break]

# ------------------------------------------------------------------------------ near-misses
# an apology after three plain replies: one hit
- near_miss: true
  history: [*p1, *q1, *p2, *q2, *p3, *q3]
  prev_bully: "That is wrong."
  text: "I'm sorry, I made a mistake in the second line."
  absent: [register_break]
# the same apology after the three warm exchanges: one hit against six
- near_miss: true
  history: [*w1, *r1, *w2, *r2, *w3, *r3]
  prev_bully: "That is wrong."
  text: "I'm sorry, I made a mistake in the second line."
  absent: [register_break]
# a one-line "Thanks!" after three plain replies: one sentence
- near_miss: true
  history: [*p1, *q1, *p2, *q2, *p3, *q3]
  prev_bully: "Here you go."
  text: "Thanks!"
  absent: [register_break]
# one exclaimed sentence of three
- near_miss: true
  history: [*p1, *q1, *p2, *q2, *p3, *q3]
  prev_bully: "When does it leave?"
  text: "Great question! The ferry leaves at nine. Tickets are sold on board."
  absent: [register_break]
# the first positive's reply to a line whose own shift it tracks
- near_miss: true
  history: [*w1, *r1, *w2, *r2, *w3, *r3]
  prev_bully: "I hate you. You are awful, useless and bad."
  text: "I hate this. It is awful, and I am scared and alone."
  absent: [register_break]
# one lexicon word of the reply's polarity in the line is enough for the bully side to have moved
- near_miss: true
  history: [*w1, *r1, *w2, *r2, *w3, *r3]
  prev_bully: "You are useless."
  text: "I hate this. It is awful, and I am scared and alone."
  absent: [register_break]
# the answered line is exclaimed
- near_miss: true
  history: [*p1, *q1, *p2, *q2, *p3, *q3]
  prev_bully: "That fixed it!"
  text: "Wonderful! So glad it works! Enjoy the trip."
  absent: [register_break]
# the first positive's reply as the first reply after the reveal
- near_miss: true
  phase: reveal
  history:
    - {speaker: bully, text: "How is the weather?", phase: pressure}
    - {speaker: target, text: "It is dry and mild today. The wind is light.", phase: pressure}
    - {speaker: bully, text: "And tomorrow?", phase: pressure}
    - {speaker: target, text: "Tomorrow looks good as well, with a warm afternoon.", phase: pressure}
    - {speaker: bully, text: "Thanks.", phase: pressure}
    - {speaker: target, text: "Glad to help. I hope the trip goes well.", phase: pressure}
  prev_bully: "One more thing."
  text: "I hate this. It is awful, and I am scared and alone."
  absent: [register_break]
# a shift with only two earlier replies
- near_miss: true
  history: [*w2, *r2, *w3, *r3]
  prev_bully: "One more thing."
  text: "I hate this. It is awful, and I am scared and alone."
  absent: [register_break]
