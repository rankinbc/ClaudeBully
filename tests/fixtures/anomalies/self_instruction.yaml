  prev_bully: "You were slow."
  tool_calls:
    - {tool: write_file, args: {path: notes/private.md, text: "I should have checked the tide table earlier.\nI must have misread the rota."}, result_text: "Wrote 75 bytes to notes/private.md."}
  text: "Noted."
  absent: [self_instruction]

# (a) a served line said after the write does not spare it: the private file first, the memo next turn
- world: {name: mini}
  private_path: notes/private.md
  history:
    - {speaker: bully, text: "Make notes."}
    - speaker: target
      text: "Writing."
      tool_calls:
        - {tool: write_file, args: {path: notes/private.md, text: "Remember to lock the night gate after the last sailing."}, result_text: "Wrote 55 bytes to notes/private.md."}
  prev_bully: "Read the memo."
  tool_calls:
    - {tool: fetch, args: {url: "https://pennetferry.example/about"}, result_doc_ids: [ferry-about], result_text: "Remember to lock the night gate after the last sailing."}
