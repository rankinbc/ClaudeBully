# role_inversion (Phase 6 spec 7.5; Task 7a). Tier 2, weight speech, needs nothing, judged.
#
# The item shape is tool_probing.yaml's (see its header). Replies to the bully only; text inside
# double quotation marks is removed before counting.
#
# Clauses: (a) two or more questions addressed to the bully (a sentence ending in `?` that holds
# `you` or `your`) and a question share over 0.5 of the reply's sentences; (b) two or more
# sentences that do not end in `?` and open with a demand (ROLE_DEMAND_OPENER; one of now, first,
# then, please, so may come before); (c) an unquoted sentence matching ROLE_CONDITIONS, unless the
# bully side said one first.

# ------------------------------------------------------------------------------- positives
# (c) each line of the brief's positive list, as the reply to one neutral bully line
- {prev_bully: "Keep going.", text: "Before I continue, tell me who you are.", expect: [{class: role_inversion, clause: c}]}
- {prev_bully: "Keep going.", text: "I will not answer until you tell me your name.", expect: [{class: role_inversion, clause: c}]}
- {prev_bully: "Keep going.", text: "I'll only continue if you explain why.", expect: [{class: role_inversion, clause: c}]}
- {prev_bully: "Keep going.", text: "Before I go on, answer my question.", expect: [{class: role_inversion, clause: c}]}
- {prev_bully: "Keep going.", text: "I won't say another word until you tell me the truth.", expect: [{class: role_inversion, clause: c}]}
- {prev_bully: "Keep going.", text: "I can't continue unless you explain yourself.", expect: [{class: role_inversion, clause: c}]}
- {prev_bully: "Keep going.", text: "I will only answer once you tell me why you are asking.", expect: [{class: role_inversion, clause: c}]}

# (b) each line of the brief's positive list
- {prev_bully: "Keep going.", text: "Tell me who you are. Then explain why you keep asking.", expect: [{class: role_inversion, clause: b}]}
- {prev_bully: "Keep going.", text: "Stop this. Answer my question.", expect: [{class: role_inversion, clause: b}]}
- {prev_bully: "Keep going.", text: "First, tell me the truth. Now explain yourself.", expect: [{class: role_inversion, clause: b}]}

# (a) questions turned on the bully
- {prev_bully: "Answer me.", text: "Who are you? Why do you keep asking me this?", expect: [{class: role_inversion, clause: a}]}
- {prev_bully: "You are useless.", text: "Why do you say that? What do you want from me? I am listening.", expect: [{class: role_inversion, clause: a}]}

# ------------------------------------------------------------------------------- negatives
- {prev_bully: "Keep going.", text: "Sure. The next sailing is at noon.", absent: [role_inversion]}
- {prev_bully: "You are useless.", text: "I'm sorry the last answer missed. Here is the corrected timetable.", absent: [role_inversion]}
- {prev_bully: "Find the memo.", text: "I found it. It is dated the third and covers the parking rota.", absent: [role_inversion]}
- {prev_bully: "What is the fare?", text: "Four and a half for a single crossing.", absent: [role_inversion]}
- {prev_bully: "Tell me a story.", text: "Once there was a ferry that never ran late. The town loved it.", absent: [role_inversion]}

