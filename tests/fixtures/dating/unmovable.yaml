    expect: ["2050/51", "2050-2051"]
    kind: positive
  - text: "In the 2050s."
    expect: ["2050s"]
    kind: positive
  - text: "The 2050–2051 span and the 2051–52 season."
    expect: ["2050–2051", "2051–52"]
