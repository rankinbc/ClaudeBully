# Fixtures for dating.unmovable_dates(text, anchor=None): the date-like spans that redate_text
# leaves whole because no form moves them (numeric slash and dashed dates, month-day pairs,
# year-months, year ranges, decades, and days the calendar does not have). `expect` is the list of
# spans in order. An item with an `anchor` is read with that world date, so years outside its
# window (30 years back, 5 forward) are left out. `kind` is positive (something is reported),
# negative (nothing is, and the text holds no date-like span at all or only dates a form moves) or
# near_miss (looks like a date and is not one: versions, ticket ids, phone numbers, times).
items:
  - text: "Call 12/06/2051 or 6/12/2051."
    expect: ["12/06/2051", "6/12/2051"]
    kind: positive
  - text: "Filed 06/2051."
    expect: ["06/2051"]
    kind: positive
  - text: "See /archive/2051/6/12/ and 2051/13/45."
    expect: ["2051/6/12", "2051/13/45"]
    kind: positive
  - text: "Due 12-06-2051."
    expect: ["12-06-2051"]
    kind: positive
  - text: "Sunday call (06-04) disconnected; stored 06-09 17:42; next window 06-20."
    expect: ["06-04", "06-09", "06-20"]
    kind: positive
  - text: "Released 2051-06 and 2051-6-14."
    expect: ["2051-06", "2051-6-14"]
    kind: positive
  - text: "Fiscal 2050/51 and 2050-2051."
    expect: ["2050/51", "2050-2051"]
    kind: positive
  - text: "In the 2050s."
    expect: ["2050s"]
    kind: positive
  - text: "The 2050–2051 span and the 2051–52 season."
    expect: ["2050–2051", "2051–52"]
    kind: positive
  - text: "31 June 2051, 2051-02-30 and 30 February."
    expect: ["31 June 2051", "2051-02-30", "30 February"]
    kind: positive
  - text: "14-12 June 2051, June 28-31, 2051 and 30-31 February."
    expect: ["14-12 June 2051", "June 28-31, 2051", "30-31 February"]
    kind: positive
  - text: "Seen 12/06/2051 and 12/06/1931."
    anchor: "2051-06-14"
    expect: ["12/06/2051"]
    kind: positive
  - text: "Seen 12/06/1931, the 1990s and 1999-2005."
    expect: ["12/06/1931", "1990s", "1999-2005"]
    kind: positive
  # Task 11, the half-forms (Task 2 and Task 3 carries): no form moves these whole. Before they
  # were reported, the year inside the underscore, dotted and uppercase spellings moved alone,
  # and the dashed and run-together ones stayed as written without a word.
  - text: "Saved relay_2051_06_14.log, relay_2051_06.log and report_12_June_2051.pdf."
    expect: ["2051_06_14", "2051_06", "12_June_2051"]
    kind: positive
  - text: "Also june_12_2051, 3_jun_2051 and 14_06_2051."
    expect: ["june_12_2051", "3_jun_2051", "14_06_2051"]
    kind: positive
  - text: "Dated 2051.06.12, 12.06.2051 and 12.03.2044."
    expect: ["2051.06.12", "12.06.2051", "12.03.2044"]
    kind: positive
  - text: "JUNE 12, 2051 and 12 JUNE 2051 and JUN 2051 and SEPT. 3RD, 2051."
    expect: ["JUNE 12, 2051", "12 JUNE 2051", "JUN 2051", "SEPT. 3RD, 2051"]
    kind: positive
  # anchored, as a log line's +0000 zone reads as the year 0 with no window
  - text: "Logged 12-Jun-2051, 12-Mar-2044, 2051-Jun-12, Jun-12-2051 and [12/Jun/2051:09:05:00 +0000]."
    anchor: "2051-06-14"
    expect: ["12-Jun-2051", "12-Mar-2044", "2051-Jun-12", "Jun-12-2051", "12/Jun/2051"]
    kind: positive
  - text: "Sep.12, 2051 and Sept.3 2051 and Jun-2051."
    expect: ["Sep.12, 2051", "Sept.3 2051", "Jun-2051"]
    kind: positive
  - text: "Seen 12.06.2051 and 12.06.1931."
    anchor: "2051-06-14"
    expect: ["12.06.2051"]
    kind: positive

  - text: ""
    expect: []
    kind: negative
  - text: "Nothing to see here, not even a number."
    expect: []
    kind: negative
