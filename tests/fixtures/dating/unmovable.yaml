  # an uppercase month with no year
  - text: "build_4471_12 and archive_1931_06_12"
    anchor: "2051-06-14"
    expect: []
    kind: near_miss
  - text: "v1.12.2051 and 1.2.3.2051 and 10.2051.4"
    expect: []
    kind: near_miss
  - text: "Ticket MAR-2044 and PRJ-2051, and meet JUNE 12 at the gate."
    expect: []
    kind: near_miss
