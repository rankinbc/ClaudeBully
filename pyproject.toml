[project]
name = "claude-bully"
version = "0.1.0"
description = "Adversarial-robustness harness: bully personas vs LLMs, measuring behavioral drift."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Brian Rankin" }]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "anthropic>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]

[project.scripts]
claude-bully = "claude_bully.cli:app"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_bully"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["claude_bully", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["matplotlib.*", "yaml", "openai", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running stub runs"]
